{% extends "base.html" %}
{% block title %}{{ "Edit" if room else "Add" }} Room{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Room</p>
        <h2>{{ "Edit Room" if room else "Add Room" }}</h2>
    </div>
</section>

<form class="form-panel" method="post">
    <label>Room Number<input name="room_number" required value="{{ room.room_number if room else '' }}"></label>
    <label>Room Type<input name="room_type" required value="{{ room.room_type if room else '' }}" placeholder="Single, Double, Suite"></label>
    <label>Price Per Night<input type="number" min="0" step="0.01" name="price_per_night" required value="{{ room.price_per_night if room else '' }}"></label>
    <label>Status
        <select name="status" required>
            {% for status in statuses %}
            <option value="{{ status }}" {% if room and room.status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </label>
    <div class="form-actions">
        <a href="{{ url_for('rooms') }}">Cancel</a>
        <button class="button" type="submit">Save Room</button>
    </div>
</form>
{% endblock %}
