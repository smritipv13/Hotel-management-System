{% extends "base.html" %}
{% block title %}{{ "Edit" if payment else "Add" }} Payment{% endblock %}
{% block content %}
<section class="page-header">
    <div>
        <p class="eyebrow">Payment</p>
        <h2>{{ "Edit Payment" if payment else "Add Payment" }}</h2>
    </div>
</section>

<form class="form-panel" method="post">
    <label>Booking
        <select name="booking_id" required>
            {% for booking in bookings %}
            <option value="{{ booking.booking_id }}" {% if payment and payment.booking_id == booking.booking_id %}selected{% endif %}>
                #{{ booking.booking_id }} - {{ booking.customer_name }} - Room {{ booking.room_number }}
            </option>
            {% endfor %}
        </select>
    </label>
    <label>Amount<input type="number" min="0" step="0.01" name="amount" required value="{{ payment.amount if payment else '' }}"></label>
    <label>Payment Date<input type="date" name="payment_date" required value="{{ payment.payment_date if payment else today }}"></label>
    <label>Payment Method
        <select name="payment_method" required>
            {% for method in methods %}
            <option value="{{ method }}" {% if payment and payment.payment_method == method %}selected{% endif %}>{{ method }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Status
        <select name="status" required>
            {% for status in statuses %}
            <option value="{{ status }}" {% if payment and payment.status == status %}selected{% endif %}>{{ status }}</option>
            {% endfor %}
        </select>
    </label>
    <div class="form-actions">
        <a href="{{ url_for('payments') }}">Cancel</a>
        <button class="button" type="submit">Save Payment</button>
    </div>
</form>
{% endblock %}
